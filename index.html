/* File nhạc tự chọn được lưu trong IndexedDB (localStorage quá nhỏ cho file âm thanh) */
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('tem_sounds', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('files');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbRun(mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', mode);
    const rq = fn(tx.objectStore('files'));
    tx.oncomplete = () => { db.close(); res(rq && rq.result); };
    tx.onerror = () => { db.close(); rej(tx.error); };
  });
}
const idbGet = k => idbRun('readonly', st => st.get(k));
const idbSet = (k, v) => idbRun('readwrite', st => st.put(v, k));
const idbDel = k => idbRun('readwrite', st => st.delete(k));

let audioCtx = null;
let currentSound = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
}
function stopSound() {
  if (currentSound) { const c = currentSound; currentSound = null; c.stop(); }
}
// Phát nhạc chuông: sound = { id, rounds }. Trả về Promise, xong khi phát hết hoặc bị dừng.
function playSound(sound) {
  stopSound();
  return new Promise(resolve => {
    const rounds = Math.min(3, Math.max(1, Number(sound && sound.rounds) || 2));
    const tone = RINGTONES.find(t => t.id === (sound && sound.id)) || RINGTONES[0];
    const h = { nodes: [], timer: null, audio: null, url: null, finished: false };
    const finish = () => {
      if (h.finished) return;
      h.finished = true;
      clearTimeout(h.timer);
      h.nodes.forEach(o => { try { o.stop(); } catch {} });
      if (h.audio) { try { h.audio.pause(); } catch {} }
      if (h.url) URL.revokeObjectURL(h.url);
      if (currentSound === h) currentSound = null;
      resolve();
    };
    h.stop = finish;
    currentSound = h;
    const synth = t => {
      if (h.finished) return;
      try {
        unlockAudio();
        for (let r = 0; r < rounds; r++) {
          t.notes.forEach((f, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            const at = audioCtx.currentTime + r * t.span + i * t.gap;
            o.type = t.wave; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.0001, at);
            g.gain.linearRampToValueAtTime(t.vol, at + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, at + t.dur);
            o.start(at); o.stop(at + t.dur + 0.1);
            h.nodes.push(o);
          });
        }
        h.timer = setTimeout(finish, (rounds * t.span + 0.5) * 1000);
      } catch { finish(); }
    };
    if (!tone.custom) return synth(tone);
    idbGet('custom').then(rec => {
      if (h.finished) return;
      if (!rec || !rec.blob) return synth(RINGTONES[0]);
      h.url = URL.createObjectURL(rec.blob);
      const a = new Audio(h.url);
      h.audio = a;
      let left = rounds;
      a.onended = () => {
        left -= 1;
        if (left > 0 && !h.finished) { a.currentTime = 0; a.play().catch(finish); } else finish();
      };
      a.onerror = () => synth(RINGTONES[0]);
      a.play().catch(() => synth(RINGTONES[0]));
    }).catch(() => synth(RINGTONES[0]));
  });
}
const vibrateAlarm = () => { if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]); };

// Hiện thông báo hệ thống. Android Chrome không cho `new Notification` từ trang, phải đi qua service worker.
async function showAlarmNotification(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const opts = { body, tag, renotify: true, requireInteraction: true, vibrate: [500, 200, 500, 200, 500] };
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) { await reg.showNotification(title, opts); return true; }
  } catch {}
  try { new Notification(title, opts); return true; } catch { return false; }
}
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {

/* ---------- Khóa PIN ---------- */
async function hashPin(p) {
  if (!window.crypto || !crypto.subtle) throw new Error('Trình duyệt không hỗ trợ mã hóa (cần HTTPS hoặc localhost)');
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tem-v2:' + p));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function PinLock({ pinHash, onUnlock }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const press = async d => {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next); setErr('');
    if (next.length === 4) {
      let ok = false;
      try { ok = (await hashPin(next)) === pinHash; } catch (e) { setErr(e.message); }
      if (ok) onUnlock();
      else if (!err || true) { setErr('Mã PIN không đúng'); setTimeout(() => setPin(''), 400); }
    }
  };
  return (
    <div className="fixed inset-0 z-50 bg-[#F6F4EF] flex flex-col items-center justify-between px-6 pt-24 pb-8">
      <div className="flex flex-col items-center">
        <h2 className="text-2xl font-bold">Nhập mã PIN</h2>
        <div className="mt-2 text-sm text-[#5B6470]">Nhập 4 số để mở ứng dụng</div>
        <div className="flex gap-[18px] mt-8">
          {[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full border-2 ${pin.length > i ? 'bg-teal-700 border-teal-700' : 'border-slate-300'}`} />)}
        </div>
        <div className="h-5 mt-4 text-[13px] text-rose-700">{err}</div>
      </div>
      <div className="grid grid-cols-3 gap-3.5 w-full max-w-[342px]">
        {['1','2','3','4','5','6','7','8','9'].map(d => (
          <button key={d} onClick={() => press(d)} className="h-[72px] w-full rounded-full bg-white border border-[#E3DFD6] text-2xl font-semibold active:scale-95">{d}</button>
        ))}
        <button onClick={() => setPin('')} className="h-[72px] w-full text-sm font-semibold text-[#5B6470]">Xóa hết</button>
        <button onClick={() => press('0')} className="h-[72px] w-full rounded-full bg-white border border-[#E3DFD6] text-2xl font-semibold active:scale-95">0</button>
        <button onClick={() => setPin(p => p.slice(0, -1))} className="h-[72px] w-full text-xl text-[#1B1F24]">⌫</button>
      </div>
    </div>
  );
}

function PinSettings({ pinHash, onSave, onClose }) {
  const [cur, setCur] = useState('');
  const [neu, setNeu] = useState('');
  const [err, setErr] = useState('');
  const submit = async e => {
    e.preventDefault();
    try {
      if (pinHash && (await hashPin(cur)) !== pinHash) return setErr('PIN hiện tại không đúng');
      if (neu === '') {
        if (!pinHash) return setErr('Nhập PIN mới 4 số để bật khóa');
        return onSave(null, onClose);
      }
      if (!/^\d{4}$/.test(neu)) return setErr('PIN phải đúng 4 chữ số');
      onSave(await hashPin(neu), onClose);
    } catch (e) { setErr(e.message); }
  };
  return (
    <Sheet title="Khóa ứng dụng (PIN 4 số)" onClose={onClose}>
      <ErrorBox msg={err} />
      <p className="text-xs text-slate-500 mb-4 leading-relaxed">
        Đây chỉ là khóa giao diện khi người khác cầm máy. Dữ liệu vẫn nằm trong trình duyệt của bạn và không được mã hóa.
      </p>
      <form onSubmit={submit} className="space-y-3">
        {pinHash && <div><label className={labelCls}>PIN hiện tại</label>
          <input className={inputCls} type="password" inputMode="numeric" maxLength={4} value={cur} onChange={e => setCur(onlyDigits(e.target.value))} /></div>}
        <div><label className={labelCls}>{pinHash ? 'PIN mới (để trống để tắt khóa)' : 'PIN mới (4 số)'}</label>
          <input className={inputCls} type="password" inputMode="numeric" maxLength={4} value={neu} onChange={e => setNeu(onlyDigits(e.target.value))} /></div>
        <button className="w-full h-[52px] rounded-full bg-teal-700 text-white font-semibold">Lưu</button>
      </form>
    </Sheet>
  );
}

function TaskForm({ date, onSave, onClose }) {
  const [f, setF] = useState({ title: '', description: '', date, startTime: '', endTime: '', priority: 'medium', estimatedMinutes: '' });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const submit = e => {
    e.preventDefault();
    if (!f.title.trim()) return setErr('Vui lòng nhập tên công việc');
    if (f.startTime && f.endTime && f.endTime < f.startTime) return setErr('Giờ kết thúc không thể trước giờ bắt đầu');
    onSave({
      id: uid(), title: f.title.trim(), description: f.description.trim(), date: f.date,
      startTime: f.startTime, endTime: f.endTime, priority: f.priority,
      estimatedMinutes: f.estimatedMinutes ? Number(f.estimatedMinutes) : null,
      actualMinutes: null, status: 'todo', createdAt: new Date().toISOString(),
    });
    onClose();
  };
  return (
    <Sheet title="Thêm công việc" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div><label className={labelCls}>Tên công việc *</label>
          <input className={inputCls} value={f.title} maxLength={150} autoFocus onChange={e => set('title', e.target.value)} /></div>
        <div><label className={labelCls}>Ghi chú</label>
          <textarea className={inputCls} rows={2} maxLength={500} value={f.description} onChange={e => set('description', e.target.value)} /></div>
        <div className="grid grid-cols-2 gap-2">
          <div><label className={labelCls}>Ngày</label><input type="date" className={inputCls} value={f.date} onChange={e => set('date', e.target.value)} /></div>
          <div><label className={labelCls}>Dự kiến (phút)</label><input type="number" min="1" className={inputCls} value={f.estimatedMinutes} onChange={e => set('estimatedMinutes', e.target.value)} /></div>
          <div><label className={labelCls}>Bắt đầu</label><input type="time" className={inputCls} value={f.startTime} onChange={e => set('startTime', e.target.value)} /></div>
          <div><label className={labelCls}>Kết thúc</label><input type="time" className={inputCls} value={f.endTime} onChange={e => set('endTime', e.target.value)} /></div>
        </div>
        <div><label className={labelCls}>Ưu tiên</label>
          <div className="grid grid-cols-3 gap-2">
            {[['low','🌱 Thấp'],['medium','⚡ Vừa'],['high','🔥 Cao']].map(([v, l]) => (
              <button type="button" key={v} onClick={() => set('priority', v)} className={`py-2 text-xs font-bold rounded-xl border ${f.priority === v ? 'bg-teal-50 border-teal-700 text-teal-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{l}</button>
            ))}
          </div></div>
        <button className="w-full h-[52px] rounded-full bg-teal-700 text-white font-semibold">Lưu công việc</button>
      </form>
    </Sheet>
  );
}

  };
  return (
    <Sheet title="Thêm khoản chi" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div>
          <label className={labelCls}>Số tiền (VNĐ) *</label>
          <input inputMode="numeric" autoFocus placeholder="0" value={fmtDigits(amount)}
            onChange={e => setAmount(onlyDigits(e.target.value))}

/* ---------- Chọn nhạc chuông ---------- */
function SoundPicker({ value, onChange }) {
  const [playing, setPlaying] = useState(null);
  const [custom, setCustom] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    idbGet('custom').then(r => r && r.blob && setCustom({ name: r.name })).catch(() => {});
    return () => stopSound();
  }, []);
  const preview = async id => {
    if (playing === id) return stopSound();
    setPlaying(id);
    await playSound({ id, rounds: 1 });
    setPlaying(p => (p === id ? null : p));
  };
  const pickFile = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('audio/')) return setErr('Chỉ nhận file âm thanh (MP3, WAV, OGG, M4A)');
    if (file.size > MAX_SOUND_BYTES) return setErr('File quá lớn, tối đa 5 MB');
    try {
      await idbSet('custom', { name: file.name.slice(0, 80), type: file.type, blob: file });
      setCustom({ name: file.name.slice(0, 80) });
      setErr('');
      onChange({ ...value, id: 'custom' });
    } catch { setErr('Không lưu được file trên máy này'); }
  };
  const removeCustom = async () => {
    stopSound();
    try { await idbDel('custom'); } catch {}
    setCustom(null);
    if (value.id === 'custom') onChange({ ...value, id: 'classic' });
  };
  const fileLabel = txt => (
    <label className="text-xs font-bold px-2.5 py-1.5 rounded-full bg-[#EDEAE2] text-[#1B1F24] cursor-pointer shrink-0">{txt}
      <input type="file" accept="audio/*" className="hidden" onChange={pickFile} /></label>
  );
  return (
    <div>
      <label className={labelCls}>Nhạc chuông</label>
      <ErrorBox msg={err} />
      <div className="space-y-1.5">
        {RINGTONES.map(t => {
          const picked = value.id === t.id;
          if (t.custom && !custom) {
            return (
              <div key={t.id} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl border border-dashed border-slate-300 bg-slate-50">
                <span className="text-sm text-slate-600">Chọn file nhạc của bạn (tối đa 5 MB)</span>
                {fileLabel('Chọn file')}
              </div>);
          }
          return (
            <div key={t.id} className={`flex items-center gap-2 px-3 py-2 rounded-xl border ${picked ? 'border-amber-400 bg-amber-50' : 'border-slate-200 bg-white'}`}>
              <button type="button" onClick={() => onChange({ ...value, id: t.id })} className="flex-1 min-w-0 flex items-center gap-2 text-left">
                <span className={`w-4 h-4 rounded-full border-2 shrink-0 ${picked ? 'border-teal-700 bg-teal-700' : 'border-[#B8B2A6]'}`} />
                <span className="text-sm font-semibold truncate">{t.custom ? custom.name : t.name}</span>
              </button>
              <button type="button" onClick={() => preview(t.id)} className="text-xs font-bold px-2.5 py-1.5 rounded-full bg-[#EDEAE2] text-[#1B1F24] shrink-0">{playing === t.id ? '■ Dừng' : '▶ Nghe thử'}</button>
              {t.custom && fileLabel('Đổi')}
              {t.custom && <button type="button" onClick={removeCustom} className="text-slate-400 hover:text-rose-600 px-1" title="Xóa file">🗑</button>}
            </div>);
        })}
      </div>
      <div className="mt-3">
        <label className={labelCls}>Số lần lặp</label>
        <div className="grid grid-cols-3 gap-2">
          {[1, 2, 3].map(n => (
            <button type="button" key={n} onClick={() => onChange({ ...value, rounds: n })}
              className={`py-2 text-xs font-bold rounded-xl border ${value.rounds === n ? 'bg-amber-50 border-amber-400 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{n} lần</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- Form Nhắc nhở ---------- */
function ReminderForm({ onSave, onClose }) {
  const [f, setF] = useState({ title: '', note: '', type: 'once', date: todayStr(), dayOfMonth: 1, time: '', sound: { ...DEFAULT_SOUND } });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const submit = e => {
    e.preventDefault();
    if (!f.title.trim()) return setErr('Nhập tiêu đề nhắc nhở');
    if (!f.time) return setErr('Chọn giờ reo chuông');
    if (f.type === 'once') {
      if (!f.date) return setErr('Chọn ngày nhắc');
      const at = new Date(`${f.date}T${f.time}`);
      if (isNaN(at.getTime()) || at.getTime() <= Date.now()) return setErr('Thời điểm này đã qua. Hãy chọn giờ hoặc ngày ở phía sau.');
    }
    onSave({
      id: uid(), title: f.title.trim(), note: f.note.trim(), type: f.type, time: f.time,
      date: f.type === 'once' ? f.date : null,
      dayOfMonth: f.type === 'monthly' ? Number(f.dayOfMonth) : null,
      sound: { id: f.sound.id, rounds: f.sound.rounds },
      enabled: true, fired: false, lastFired: f.type !== 'once' && f.time <= nowHM() ? todayStr() : null, createdAt: new Date().toISOString(),
    });
    onClose();
  };
  return (
    <Sheet title="Thêm nhắc nhở" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div><label className={labelCls}>Tiêu đề *</label>
          <input className={inputCls} autoFocus maxLength={150} value={f.title} onChange={e => set('title', e.target.value)} /></div>
        <div><label className={labelCls}>Ghi chú</label>
          <input className={inputCls} maxLength={300} value={f.note} onChange={e => set('note', e.target.value)} /></div>
        <div className="grid grid-cols-3 gap-2">
          {[['once','📅 Một lần'],['daily','🔁 Hàng ngày'],['monthly','📆 Hàng tháng']].map(([v, l]) => (
            <button type="button" key={v} onClick={() => set('type', v)} className={`py-2 text-xs font-bold rounded-xl border ${f.type === v ? 'bg-amber-50 border-amber-400 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{l}</button>
          ))}
        </div>
        {f.type === 'once' && <div><label className={labelCls}>Ngày</label><input type="date" className={inputCls} value={f.date} onChange={e => set('date', e.target.value)} /></div>}
        {f.type === 'monthly' && <div><label className={labelCls}>Ngày trong tháng</label>
          <select className={inputCls} value={f.dayOfMonth} onChange={e => set('dayOfMonth', e.target.value)}>
            {Array.from({ length: 31 }, (_, i) => i + 1).map(d => <option key={d} value={d}>Ngày {d}</option>)}
          </select></div>}
        <div><label className={labelCls}>Giờ reo chuông</label>
          <input type="time" className={inputCls} value={f.time} onChange={e => set('time', e.target.value)} /></div>
        <SoundPicker value={f.sound} onChange={v => set('sound', v)} />
        <p className="text-xs text-slate-500">Lưu ý: bản web chỉ reo khi trang đang mở trên máy. Đóng trình duyệt hoặc khóa điện thoại lâu thì sẽ không reo (cần bản Android để reo khi tắt màn hình).</p>
        <button className="w-full h-[52px] rounded-full bg-teal-700 text-white font-semibold">Lưu nhắc nhở</button>
      </form>
    </Sheet>
  );
}

function TasksView({ tasks, date, setDate, onAdd, onToggle, onDelete }) {
  const list = tasks.filter(t => t.date === date);
  const done = list.filter(t => t.status === 'done');
  const todo = list.filter(t => t.status !== 'done');
  const pct = list.length ? Math.round(done.length / list.length * 100) : 0;
  const toggle = t => {
    if (t.status === 'done') return onToggle(t.id, { status: 'todo', actualMinutes: null });
    const v = window.prompt('Việc này thực tế mất bao nhiêu phút? (để trống nếu không cần)', t.estimatedMinutes || '');
    if (v === null) return;
    const mins = v.trim() === '' ? null : Math.max(0, Number(v) || 0);
    onToggle(t.id, { status: 'done', actualMinutes: mins });
  };
  return (
    <div className="p-4 space-y-4 pb-24">
      <div className="flex items-center gap-2">
        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="text-sm bg-white border border-[#E3DFD6] rounded-xl px-3 py-2" />
        {date !== todayStr() && <button onClick={() => setDate(todayStr())} className="ml-auto text-xs font-semibold text-teal-700 bg-teal-50 px-3 py-2 rounded-full">Hôm nay</button>}
      </div>
      <div className="bg-teal-700 rounded-2xl p-4 text-white">
        <div className="text-[13px]">Đã hoàn thành · {fmtDate(date)}</div>
        <div className="text-2xl font-bold">{done.length} / {list.length} việc</div>
        <div className="w-full bg-white/30 h-2 rounded-full mt-3"><div className="bg-white h-full rounded-full" style={{ width: `${pct}%` }} /></div>
      </div>
      <div>
        <h3 className="text-sm font-semibold mb-2">Chưa làm ({todo.length})</h3>
        {todo.length === 0 ? <div className="bg-white border border-[#E3DFD6] rounded-2xl p-5 text-center text-sm text-slate-500">Không còn việc tồn đọng</div> :
          <div className="space-y-2">{todo.map(t => (
            <div key={t.id} className="bg-white border border-[#E3DFD6] rounded-[14px] p-3.5 flex gap-3 items-start">
              <button onClick={() => toggle(t)} aria-label="Đánh dấu xong" className="w-6 h-6 mt-0.5 rounded-full border-2 border-[#B8B2A6] shrink-0"></button>
              <div className="flex-1 min-w-0">
                <div className="flex justify-between gap-2"><span className="font-semibold text-base truncate">{t.title}</span>
                  {t.priority === 'high' && <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">Ưu tiên cao</span>}</div>
                {t.description && <p className="text-xs text-slate-500 mt-0.5">{t.description}</p>}
                <div className="text-[11px] text-slate-500 mt-1 flex gap-3">
                  {(t.startTime || t.endTime) && <span>🕒 {t.startTime}{t.endTime ? ` - ${t.endTime}` : ''}</span>}
                  {t.estimatedMinutes && <span>Dự kiến {t.estimatedMinutes} phút</span>}
                </div>
              </div>
              <button onClick={() => window.confirm(`Xóa công việc "${t.title}"?`) && onDelete(t.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
            </div>))}</div>}
      </div>
      {done.length > 0 && <div>
        <h3 className="text-sm font-semibold text-teal-700 mb-2">Đã hoàn thành ({done.length})</h3>
        <div className="space-y-2">{done.map(t => (
          <div key={t.id} className="bg-[#EDEAE2] rounded-[14px] p-3.5 flex items-center gap-3">
            <button onClick={() => toggle(t)} aria-label="Bỏ đánh dấu" className="w-6 h-6 rounded-full bg-teal-700 text-white text-sm leading-none shrink-0">✓</button>
            <span className="flex-1 text-sm line-through text-slate-500 truncate">{t.title}</span>
            <span className="text-xs text-teal-700">{t.actualMinutes != null ? `${t.actualMinutes} phút` : 'chưa ghi phút'}</span>
            <button onClick={() => window.confirm(`Xóa công việc "${t.title}"?`) && onDelete(t.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
          </div>))}</div>
      </div>}
      <button onClick={onAdd} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-amber-700 text-white text-3xl shadow-lg">+</button>
    </div>
  );

            <div className="flex-1 min-w-0">
              <div className="text-[28px] leading-none font-bold">{r.time}</div><div className="font-semibold text-[15px] truncate mt-1">{r.title}</div>
              {r.note && <p className="text-xs text-slate-500 truncate">{r.note}</p>}
              <div className="text-xs mt-1 flex flex-wrap items-center gap-2"><span className="text-[#5B6470]">{typeLabel(r)}</span></div>
              <button onClick={() => onChangeSound(r)} className="mt-1.5 text-xs font-semibold text-teal-700 bg-teal-50 px-2.5 py-1 rounded-full truncate max-w-full">🎵 {soundLabel(r.sound)} · đổi</button>
              {r.type === 'once' && r.fired && <div className="text-[11px] text-teal-700 mt-1">✓ Đã nhắc</div>}
            </div>
            <button onClick={() => onToggle(r.id)} className={`w-12 h-7 rounded-full relative shrink-0 ${r.enabled ? 'bg-teal-700' : 'bg-[#B8B2A6]'}`}>
              <span className={`absolute top-[3px] w-[22px] h-[22px] rounded-full bg-white transition-all ${r.enabled ? 'left-[23px]' : 'left-[3px]'}`} /></button>
            <button onClick={() => window.confirm(`Xóa nhắc nhở "${r.title}"?`) && onDelete(r.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
          </div>))}</div>}
      <button onClick={onAdd} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-amber-700 text-white text-3xl shadow-lg">+</button>
    </div>
  );
}

function ReportView({ tasks, expenses, limits, month, setMonth, onImport, data, onPinSettings }) {
  const mTasks = tasks.filter(t => t.date.startsWith(month));
  const done = mTasks.filter(t => t.status === 'done');
  const withMins = done.filter(t => t.actualMinutes != null || t.estimatedMinutes != null);
  const totalMins = withMins.reduce((s, t) => s + (t.actualMinutes ?? t.estimatedMinutes), 0);
  const noMins = done.length - withMins.length;
  const mExp = expenses.filter(e => e.date.startsWith(month));
  const total = mExp.reduce((s, e) => s + e.amount, 0);
  const limit = limitFor(limits, month);
  const byCat = Object.entries(mExp.reduce((acc, e) => { acc[e.category] = (acc[e.category] || 0) + e.amount; return acc; }, {}))
    .sort((a, b) => b[1] - a[1]);
  const weeks = [0, 0, 0, 0];
  mExp.forEach(e => { const d = Number(e.date.slice(8, 10)); weeks[Math.min(3, Math.floor((d - 1) / 7))] += e.amount; });
  const maxWeek = Math.max(1, ...weeks);
  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `sao-luu-${todayStr()}.json`; a.click();
  };
  const importData = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (window.confirm('Nhập file sẽ THAY THẾ toàn bộ dữ liệu hiện có. Tiếp tục?')) onImport(obj);
      } catch { alert('File không hợp lệ'); }
    };
    reader.readAsText(file); e.target.value = '';
  };
  return (
    <div className="p-4 space-y-3 pb-28">
      <input type="month" value={month} onChange={e => e.target.value && setMonth(e.target.value)} className="text-sm bg-white border border-[#E3DFD6] rounded-xl px-3 py-2" />
      <div className="grid grid-cols-2 gap-2.5">
        <div className="p-3.5 bg-white border border-[#E3DFD6] rounded-[14px]"><div className="text-xs text-[#5B6470]">Việc hoàn thành</div><div className="mt-1 text-[22px] font-bold text-teal-700">{done.length} / {mTasks.length}</div></div>
        <div className="p-3.5 bg-white border border-[#E3DFD6] rounded-[14px]"><div className="text-xs text-[#5B6470]">Chi tiêu</div><div className="mt-1 text-[22px] font-bold text-amber-700">{fmtVND(total)}</div></div>
      </div>
      <div className="bg-white border border-[#E3DFD6] rounded-2xl p-4">
        <div className="text-sm font-semibold">Chi tiêu theo tuần</div>
        <div className="mt-4 h-[120px] flex items-end justify-around gap-3">
          {weeks.map((v, k) => <div key={k} title={fmtVND(v)} className="flex-1 bg-amber-700 rounded-t-md" style={{ height: `${Math.max(v / maxWeek * 100, v ? 4 : 1)}%`, opacity: v ? 1 : 0.25 }} />)}
        </div>
        <div className="mt-1.5 flex justify-around text-xs text-[#5B6470]">{weeks.map((v, k) => <span key={k}>Tuần {k + 1}</span>)}</div>
      </div>
      <div className="bg-white border border-[#E3DFD6] rounded-2xl p-4 space-y-2">
        <h3 className="font-semibold">Công việc</h3>
        <p className="text-sm">Tổng thời gian đã làm: <b>{Math.floor(totalMins / 60)} giờ {totalMins % 60} phút</b></p>
        {noMins > 0 && <p className="text-xs text-amber-700">{noMins} việc đã xong nhưng chưa có số phút, không được tính vào tổng.</p>}
      </div>
      <div className="bg-white border border-[#E3DFD6] rounded-2xl p-4 space-y-3">
        <h3 className="font-semibold">Chi tiêu</h3>
        <div className="flex justify-between text-sm"><span>Tổng đã chi</span><b>{fmtVND(total)}</b></div>
        <div className="flex justify-between text-sm"><span>Hạn mức</span><b>{limit ? fmtVND(limit) : 'Chưa đặt'}</b></div>
        {limit > 0 && <div className={`text-sm font-bold ${total > limit ? 'text-rose-700' : 'text-teal-700'}`}>{total > limit ? `Vượt ${fmtVND(total - limit)}` : `Còn ${fmtVND(limit - total)}`}</div>}
        {byCat.length === 0 ? <p className="text-xs text-slate-400">Chưa có chi tiêu tháng này</p> : byCat.map(([k, v]) => {
          const c = CATS[k] || CATS.other; const p = total ? Math.round(v / total * 100) : 0;
          return <div key={k}><div className="flex justify-between text-xs"><span>{c.icon} {c.label}</span><span className="font-bold">{fmtVND(v)} ({p}%)</span></div>
            <div className="w-full bg-slate-100 h-2 rounded-full mt-1"><div className={`${c.bar} h-full rounded-full`} style={{ width: `${p}%` }} /></div></div>;
        })}
      </div>
      <div className="bg-white border border-[#E3DFD6] rounded-2xl p-4 space-y-2">
        <h3 className="font-semibold">Sao lưu dữ liệu</h3>
        <p className="text-xs text-slate-500">Dữ liệu chỉ nằm trong trình duyệt này. Nên xuất file sao lưu định kỳ.</p>
        <div className="flex flex-col gap-2.5 pt-1">
          <button onClick={exportData} className="h-[52px] rounded-full border border-teal-700 bg-white text-teal-700 font-semibold text-[15px]">Xuất dữ liệu (JSON)</button>
          <label className="h-[52px] rounded-full border border-[#5B6470] bg-white flex items-center justify-center font-semibold text-[15px] cursor-pointer">Nhập dữ liệu (JSON)<input type="file" accept="application/json" className="hidden" onChange={importData} /></label>
        </div>
      </div>
      <button onClick={onPinSettings} className="w-full h-[52px] rounded-full bg-[#EDEAE2] font-semibold text-[15px]">Cài đặt khóa PIN</button>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState('tasks');
  const [tasks, setTasks] = useState(() => load(KEYS.tasks, []));
  const [expenses, setExpenses] = useState(() => load(KEYS.expenses, []));
  const [limits, setLimits] = useState(() => load(KEYS.limits, {}));
  const [reminders, setReminders] = useState(() => load(KEYS.reminders, []));
  const [pinHash, setPinHash] = useState(() => load(KEYS.pin, null));
  const [locked, setLocked] = useState(() => !!load(KEYS.pin, null));
  const [date, setDate] = useState(todayStr());
  const [month, setMonth] = useState(monthStr());
  const [modal, setModal] = useState(null);
  const [alarm, setAlarm] = useState(null);
  const [editSound, setEditSound] = useState(null);

  useEffect(() => save(KEYS.tasks, tasks), [tasks]);
  useEffect(() => save(KEYS.expenses, expenses), [expenses]);
  useEffect(() => save(KEYS.limits, limits), [limits]);
  useEffect(() => save(KEYS.reminders, reminders), [reminders]);
  useEffect(() => { if (pinHash) save(KEYS.pin, pinHash); else { try { localStorage.removeItem(KEYS.pin); } catch {} } }, [pinHash]);

  // Kiểm tra nhắc nhở: mỗi 5 giây và khi quay lại tab
  const remRef = useRef(reminders);
  remRef.current = reminders;
  useEffect(() => {
    const fire = (r, missedLabel) => {
      setAlarm({ ...r, missedLabel });
      playSound(r.sound || DEFAULT_SOUND);
      vibrateAlarm();
      showAlarmNotification((missedLabel ? '⏰ Đã lỡ: ' : '⏰ ') + r.title, r.note || `Giờ hẹn: ${missedLabel || r.time}`, 'rem-' + r.id);
    };
    const check = () => {
      const now = new Date(), today = todayStr();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      let changed = false;
      const next = remRef.current.map(r => {
        if (!r.enabled || !r.time) return r;
        const [h, m] = r.time.split(':').map(Number);
        const lateMin = nowMin - (h * 60 + m); // số phút đã trễ so với giờ hẹn hôm nay
        let due = false, missedLabel = null;
        if (r.type === 'once') {
          if (r.fired) return r;
          if (r.date < today) { due = true; missedLabel = `${r.time} ngày ${fmtDate(r.date)}`; }
          else if (r.date === today && lateMin >= 0) { due = true; if (lateMin > 2) missedLabel = r.time; }
        } else if (lateMin >= 0) {
          if (r.type === 'daily') due = r.lastFired !== today;
          if (r.type === 'monthly') due = Number(r.dayOfMonth) === now.getDate() && r.lastFired !== today;
          if (due && lateMin > 2) missedLabel = r.time;
        }
        if (!due) return r;
        changed = true;
        fire(r, missedLabel);
        return r.type === 'once' ? { ...r, fired: true, enabled: false } : { ...r, lastFired: today };
      });
      if (changed) setReminders(next);
    };
    check();
    // Worker không bị trình duyệt làm chậm khi tab chạy nền như setInterval của trang
    let worker = null, timer = null;
    try {
      worker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},5000)'], { type: 'text/javascript' })));
      worker.onmessage = check;
    } catch { timer = setInterval(check, 5000); }
    document.addEventListener('visibilitychange', check);
    window.addEventListener('focus', check);
    window.addEventListener('pageshow', check);
    return () => {
      if (worker) worker.terminate();
      if (timer) clearInterval(timer);
      document.removeEventListener('visibilitychange', check);
      window.removeEventListener('focus', check);
      window.removeEventListener('pageshow', check);
    };
  }, []);

  useEffect(() => {
    document.addEventListener('pointerdown', unlockAudio, { once: true });
    return () => document.removeEventListener('pointerdown', unlockAudio);
  }, []);
  const dismissAlarm = () => { stopSound(); setAlarm(null); };

  const requestNotif = () => {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  };

  const toggleTask = (id, patch) => setTasks(p => p.map(t => t.id === id ? { ...t, ...patch, completedAt: patch.status === 'done' ? new Date().toISOString() : null } : t));
  const deleteTask = id => setTasks(p => p.filter(t => t.id !== id));
  const addExpense = e => setExpenses(p => [e, ...p]);
  const deleteExpense = id => setExpenses(p => p.filter(e => e.id !== id));
  const setLimit = (m, amount) => setLimits(p => ({ ...p, [m]: amount }));
  const toggleReminder = id => setReminders(p => p.map(r => {
    if (r.id !== id) return r;
    if (r.enabled) return { ...r, enabled: false };
    if (r.type === 'once' && new Date(`${r.date}T${r.time}`).getTime() <= Date.now()) {
      setTimeout(() => alert('Thời điểm nhắc đã qua. Hãy tạo nhắc nhở mới.'), 0);
      return r;
    }
    return { ...r, enabled: true, fired: false, lastFired: r.type !== 'once' && r.time <= nowHM() ? todayStr() : r.lastFired };
  }));
  const deleteReminder = id => setReminders(p => p.filter(r => r.id !== id));
  const addReminder = r => { requestNotif(); setReminders(p => [r, ...p]); };

  const savePin = (hash, done) => { setPinHash(hash); if (!hash) setLocked(false); done(); };

  const importAll = obj => {
    if (Array.isArray(obj.tasks)) setTasks(obj.tasks);
    if (Array.isArray(obj.expenses)) setExpenses(obj.expenses);
    if (obj.limits && typeof obj.limits === 'object') setLimits(obj.limits);
    if (Array.isArray(obj.reminders)) setReminders(obj.reminders);
  };

  const tabs = [
    ['tasks', 'Công việc'], ['expenses', 'Chi tiêu'], ['reminders', 'Nhắc nhở'], ['report', 'Báo cáo'],
  ];
  const pendingTasks = tasks.filter(t => t.status !== 'done').length;
  const activeRem = reminders.filter(r => r.enabled).length;

  if (locked && pinHash) return <PinLock pinHash={pinHash} onUnlock={() => setLocked(false)} />;

  const headerRight = (<>
    {pinHash && <button className={iconBtn} title="Khóa ngay" aria-label="Khóa ngay" onClick={() => setLocked(true)}><Ico d={ICONS.lock} size={20} /></button>}
  </>);
  const titles = { tasks: [date === todayStr() ? 'Hôm nay' : 'Công việc', fmtDate(date)], expenses: ['Chi tiêu', `Tháng ${month.slice(5)}/${month.slice(0,4)}`], reminders: ['Nhắc nhở', 'Báo thức & nhạc chuông'], report: ['Báo cáo', `Tháng ${month.slice(5)}/${month.slice(0,4)}`] };

  return (
    <div className="min-h-screen max-w-md mx-auto bg-[#F6F4EF] flex flex-col relative">
      {alarm && (
        <div className="fixed top-3 inset-x-3 z-50 bg-gradient-to-r from-rose-600 to-amber-600 text-white rounded-2xl p-3.5 shadow-2xl flex items-center justify-between">
          <div className="min-w-0"><div className="text-[10px] uppercase text-amber-200 font-bold">{alarm.missedLabel ? `Đã lỡ giờ hẹn ${alarm.missedLabel}` : 'Đến giờ hẹn'}</div><div className="text-sm font-extrabold truncate">{alarm.title}</div></div>
          <button onClick={dismissAlarm} className="bg-white text-rose-700 font-bold px-3 py-1.5 rounded-xl text-xs shrink-0">Tắt chuông</button>
        </div>
      )}
      <Header title={titles[tab][0]} subtitle={titles[tab][1]} right={headerRight} />
      <main className="flex-1 overflow-y-auto">
        {tab === 'tasks' && <TasksView tasks={tasks} date={date} setDate={setDate} onAdd={() => setModal('task')} onToggle={toggleTask} onDelete={deleteTask} />}
        {tab === 'expenses' && <ExpensesView expenses={expenses} limits={limits} month={month} setMonth={setMonth} onAdd={() => setModal('expense')} onDelete={deleteExpense} onSetLimit={() => setModal('limit')} />}
        {tab === 'reminders' && <RemindersView reminders={reminders} onToggle={toggleReminder} onDelete={deleteReminder} onAdd={() => setModal('reminder')} onTest={() => { playSound({ id: 'classic', rounds: 1 }); requestNotif(); showAlarmNotification('🔔 Thông báo thử', 'Nếu bạn thấy thông báo này thì app báo được khi chạy nền.', 'test'); }} onChangeSound={r => { setEditSound(r.id); setModal('sound'); }} />}
        {tab === 'report' && <ReportView tasks={tasks} expenses={expenses} limits={limits} month={month} setMonth={setMonth} onImport={importAll}
          data={{ tasks, expenses, limits, reminders }} onPinSettings={() => setModal('pin')} />}
      </main>
      <nav className="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white border-t border-[#E3DFD6] grid grid-cols-4 pt-2 h-[84px] z-30">
        {tabs.map(([id, label]) => {
          const badge = id === 'tasks' ? pendingTasks : id === 'reminders' ? activeRem : 0;
          return (
            <button key={id} onClick={() => setTab(id)} className={`relative flex flex-col items-center gap-1 text-xs ${tab === id ? 'text-teal-700 font-semibold' : 'text-[#5B6470]'}`}>
              <Ico d={ICONS[id]} />{label}
              {badge > 0 && <span className="absolute -top-1 left-1/2 ml-2 bg-amber-700 text-white text-[10px] rounded-full px-1.5">{badge}</span>}
            </button>);
        })}
      </nav>

      {modal === 'task' && <TaskForm date={date} onSave={addTask => setTasks(p => [{ ...addTask }, ...p])} onClose={() => setModal(null)} />}
      {modal === 'expense' && <ExpenseForm onSave={addExpense} onClose={() => setModal(null)} />}
      {modal === 'reminder' && <ReminderForm onSave={addReminder} onClose={() => setModal(null)} />}
      {modal === 'sound' && editSound && <SoundForm reminder={reminders.find(r => r.id === editSound)} onSave={sound => setReminders(p => p.map(x => x.id === editSound ? { ...x, sound } : x))} onClose={() => { setModal(null); setEditSound(null); }} />}
      {modal === 'limit' && <LimitForm month={month} current={limitFor(limits, month)} onSave={setLimit} onClose={() => setModal(null)} />}
      {modal === 'pin' && <PinSettings pinHash={pinHash} onSave={savePin} onClose={() => setModal(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
