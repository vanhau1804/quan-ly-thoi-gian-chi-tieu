<body class="bg-slate-100 text-slate-800 select-none">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Storage ---------- */
const KEYS = {
  tasks: 'tem_tasks_v2',
  expenses: 'tem_expenses_v2',
  limits: 'tem_limits_v2',      // { "2026-10": 8000000, ... } – hạn mức theo từng tháng
  reminders: 'tem_reminders_v2',
  pin: 'tem_pin_v2',            // hash của PIN (chỉ dùng để khóa giao diện)
};
const load = (k, d) => {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; }
};
const save = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { alert('Không lưu được dữ liệu trên máy này: ' + e.message); }
};

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthStr = () => todayStr().slice(0, 7);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtVND = n => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(n || 0);
const fmtDigits = s => s ? new Intl.NumberFormat('vi-VN').format(Number(s)) : '';
const onlyDigits = s => s.replace(/\D/g, '');
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };

// Hạn mức của tháng m = hạn mức đặt gần nhất trước hoặc trong tháng m
function limitFor(limits, m) {
  const keys = Object.keys(limits).filter(k => k <= m).sort();
  return keys.length ? limits[keys[keys.length - 1]] : 0;
}

const CATS = {
  food: { label: 'Ăn uống', icon: '🍜', cls: 'bg-amber-100 text-amber-700', bar: 'bg-amber-500' },
  transport: { label: 'Di chuyển', icon: '🛵', cls: 'bg-blue-100 text-blue-700', bar: 'bg-blue-500' },
  shopping: { label: 'Mua sắm', icon: '🛍️', cls: 'bg-pink-100 text-pink-700', bar: 'bg-pink-500' },
  bills: { label: 'Hóa đơn', icon: '🧾', cls: 'bg-orange-100 text-orange-700', bar: 'bg-orange-500' },
  housing: { label: 'Nhà cửa', icon: '🏠', cls: 'bg-indigo-100 text-indigo-700', bar: 'bg-indigo-500' },
  entertainment: { label: 'Giải trí', icon: '🎬', cls: 'bg-purple-100 text-purple-700', bar: 'bg-purple-500' },
  health: { label: 'Sức khỏe', icon: '❤️', cls: 'bg-emerald-100 text-emerald-700', bar: 'bg-emerald-500' },
  education: { label: 'Học tập', icon: '📚', cls: 'bg-teal-100 text-teal-700', bar: 'bg-teal-500' },
  other: { label: 'Khác', icon: '📌', cls: 'bg-slate-100 text-slate-700', bar: 'bg-slate-500' },
};

/* ---------- Âm thanh & thông báo ---------- */
let audioCtx = null;
function playChime(rounds = 2) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [659.25, 830.61, 987.77, 1318.51];
    for (let r = 0; r < rounds; r++) {
      notes.forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t = audioCtx.currentTime + r * 2.2 + i * 0.25;
        o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.start(t); o.stop(t + 1);
      });
    }
  } catch {}
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
}

/* ---------- UI nhỏ ---------- */
const inputCls = "w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500";
const labelCls = "block text-xs font-bold text-slate-700 mb-1";

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
      <div className="w-full sm:max-w-md bg-white rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
          <h3 className="font-bold text-slate-800">{title}</h3>
          <button onClick={onClose} className="text-slate-400 text-2xl leading-none px-2">×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ErrorBox({ msg }) {
  if (!msg) return null;
  return <div className="mb-3 p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">{msg}</div>;
}

function Header({ title, subtitle, right }) {
  return (
    <header className="bg-white px-4 py-3 border-b border-slate-100 flex items-center justify-between sticky top-0 z-20">
      <div className="min-w-0 flex-1 mr-2">
        <div className="text-xs font-semibold text-indigo-600 uppercase truncate">{subtitle}</div>
        <h1 className="text-xl font-bold truncate">{title}</h1>
      </div>
      <div className="flex items-center gap-1.5 shrink-0">{right}</div>
    </header>
  );
}

const iconBtn = "w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-sm";

/* ---------- Khóa PIN ---------- */
async function hashPin(p) {
  if (!window.crypto || !crypto.subtle) throw new Error('Trình duyệt không hỗ trợ mã hóa (cần HTTPS hoặc localhost)');
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tem-v2:' + p));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function PinLock({ pinHash, onUnlock }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const press = async d => {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next); setErr('');
    if (next.length === 4) {
      let ok = false;
      try { ok = (await hashPin(next)) === pinHash; } catch (e) { setErr(e.message); }
      if (ok) onUnlock();
      else if (!err || true) { setErr('Mã PIN không đúng'); setTimeout(() => setPin(''), 400); }
    }
  };
  return (
    <div className="fixed inset-0 z-50 bg-slate-50 flex flex-col items-center justify-between p-6">
      <div className="mt-8 flex flex-col items-center">
        <div className="text-4xl mb-3">🔒</div>
        <h2 className="text-xl font-extrabold">Ứng dụng đang khóa</h2>
        <div className="flex gap-4 mt-8">
          {[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full border-2 ${pin.length > i ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300'}`} />)}
        </div>
        <div className="h-6 mt-3 text-xs font-bold text-rose-600">{err}</div>
      </div>
      <div className="grid grid-cols-3 gap-4 mb-8 w-full max-w-[280px]">
        {['1','2','3','4','5','6','7','8','9'].map(d => (
          <button key={d} onClick={() => press(d)} className="w-16 h-16 mx-auto rounded-full bg-white border border-slate-200 text-2xl font-bold shadow-sm active:scale-90">{d}</button>
        ))}
        <button onClick={() => setPin('')} className="w-16 h-16 mx-auto text-xs font-bold text-slate-400">Xóa hết</button>
        <button onClick={() => press('0')} className="w-16 h-16 mx-auto rounded-full bg-white border border-slate-200 text-2xl font-bold shadow-sm active:scale-90">0</button>
        <button onClick={() => setPin(p => p.slice(0, -1))} className="w-16 h-16 mx-auto text-xl text-slate-600">⌫</button>
      </div>
    </div>
  );
}

function PinSettings({ pinHash, onSave, onClose }) {
  const [cur, setCur] = useState('');
  const [neu, setNeu] = useState('');
  const [err, setErr] = useState('');
  const submit = async e => {
    e.preventDefault();
    try {
      if (pinHash && (await hashPin(cur)) !== pinHash) return setErr('PIN hiện tại không đúng');
      if (neu === '') {
        if (!pinHash) return setErr('Nhập PIN mới 4 số để bật khóa');
        return onSave(null, onClose);
      }
      if (!/^\d{4}$/.test(neu)) return setErr('PIN phải đúng 4 chữ số');
      onSave(await hashPin(neu), onClose);
    } catch (e) { setErr(e.message); }
  };
  return (
    <Sheet title="Khóa ứng dụng (PIN 4 số)" onClose={onClose}>
      <ErrorBox msg={err} />
      <p className="text-xs text-slate-500 mb-4 leading-relaxed">
        Đây chỉ là khóa giao diện khi người khác cầm máy. Dữ liệu vẫn nằm trong trình duyệt của bạn và không được mã hóa.
      </p>
      <form onSubmit={submit} className="space-y-3">
        {pinHash && <div><label className={labelCls}>PIN hiện tại</label>
          <input className={inputCls} type="password" inputMode="numeric" maxLength={4} value={cur} onChange={e => setCur(onlyDigits(e.target.value))} /></div>}
        <div><label className={labelCls}>{pinHash ? 'PIN mới (để trống để tắt khóa)' : 'PIN mới (4 số)'}</label>
          <input className={inputCls} type="password" inputMode="numeric" maxLength={4} value={neu} onChange={e => setNeu(onlyDigits(e.target.value))} /></div>
        <button className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold">Lưu</button>
      </form>
    </Sheet>
  );
}

/* ---------- Form Việc ---------- */
function TaskForm({ date, onSave, onClose }) {
  const [f, setF] = useState({ title: '', description: '', date, startTime: '', endTime: '', priority: 'medium', estimatedMinutes: '' });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const submit = e => {
    e.preventDefault();
    if (!f.title.trim()) return setErr('Vui lòng nhập tên công việc');
    if (f.startTime && f.endTime && f.endTime < f.startTime) return setErr('Giờ kết thúc không thể trước giờ bắt đầu');
    onSave({
      id: uid(), title: f.title.trim(), description: f.description.trim(), date: f.date,
      startTime: f.startTime, endTime: f.endTime, priority: f.priority,
      estimatedMinutes: f.estimatedMinutes ? Number(f.estimatedMinutes) : null,
      actualMinutes: null, status: 'todo', createdAt: new Date().toISOString(),
    });
    onClose();
  };
  return (
    <Sheet title="Thêm công việc" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div><label className={labelCls}>Tên công việc *</label>
          <input className={inputCls} value={f.title} maxLength={150} autoFocus onChange={e => set('title', e.target.value)} /></div>
        <div><label className={labelCls}>Ghi chú</label>
          <textarea className={inputCls} rows={2} maxLength={500} value={f.description} onChange={e => set('description', e.target.value)} /></div>
        <div className="grid grid-cols-2 gap-2">
          <div><label className={labelCls}>Ngày</label><input type="date" className={inputCls} value={f.date} onChange={e => set('date', e.target.value)} /></div>
          <div><label className={labelCls}>Dự kiến (phút)</label><input type="number" min="1" className={inputCls} value={f.estimatedMinutes} onChange={e => set('estimatedMinutes', e.target.value)} /></div>
          <div><label className={labelCls}>Bắt đầu</label><input type="time" className={inputCls} value={f.startTime} onChange={e => set('startTime', e.target.value)} /></div>
          <div><label className={labelCls}>Kết thúc</label><input type="time" className={inputCls} value={f.endTime} onChange={e => set('endTime', e.target.value)} /></div>
        </div>
        <div><label className={labelCls}>Ưu tiên</label>
          <div className="grid grid-cols-3 gap-2">
            {[['low','🌱 Thấp'],['medium','⚡ Vừa'],['high','🔥 Cao']].map(([v, l]) => (
              <button type="button" key={v} onClick={() => set('priority', v)} className={`py-2 text-xs font-bold rounded-xl border ${f.priority === v ? 'bg-indigo-50 border-indigo-400 text-indigo-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{l}</button>
            ))}
          </div></div>
        <button className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold">Lưu công việc</button>
      </form>
    </Sheet>
  );
}

/* ---------- Form Chi tiêu ---------- */
function ExpenseForm({ onSave, onClose }) {
  const [amount, setAmount] = useState('');
  const [cat, setCat] = useState('food');
  const [note, setNote] = useState('');
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowHM());
  const [err, setErr] = useState('');
  const addQuick = v => setAmount(s => String(Number(s || 0) + v));
  const submit = e => {
    e.preventDefault();
    const n = Number(amount);
    if (!n || n <= 0) return setErr('Số tiền phải lớn hơn 0');
    if (!note.trim()) return setErr('Nhập ghi chú để tiện đối soát cuối tháng');
    onSave({ id: uid(), amount: n, category: cat, note: note.trim(), date, time, createdAt: new Date().toISOString() });
    onClose();
  };
  return (
    <Sheet title="Thêm khoản chi" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div>
          <label className={labelCls}>Số tiền (VNĐ) *</label>
          <input inputMode="numeric" autoFocus placeholder="0" value={fmtDigits(amount)}
            onChange={e => setAmount(onlyDigits(e.target.value))}
            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xl font-black text-rose-600 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          <div className="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar">
            {[20000, 50000, 100000, 200000, 500000].map(v => (
              <button type="button" key={v} onClick={() => addQuick(v)} className="px-2.5 py-1 rounded-xl bg-slate-100 text-xs font-bold whitespace-nowrap">+{fmtDigits(String(v))}</button>
            ))}
          </div>
        </div>
        <div><label className={labelCls}>Danh mục</label>
          <div className="grid grid-cols-3 gap-2">
            {Object.entries(CATS).map(([k, c]) => (
              <button type="button" key={k} onClick={() => setCat(k)} className={`p-2 rounded-xl text-xs font-bold border ${cat === k ? 'bg-emerald-50 border-emerald-400 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>{c.icon} {c.label}</button>
            ))}
          </div></div>
        <div><label className={labelCls}>Ghi chú *</label>
          <input className={inputCls} maxLength={200} value={note} onChange={e => setNote(e.target.value)} placeholder="Vd: cơm trưa, đổ xăng..." /></div>
        <div className="grid grid-cols-2 gap-2">
          <div><label className={labelCls}>Ngày</label><input type="date" className={inputCls} value={date} onChange={e => setDate(e.target.value)} /></div>
          <div><label className={labelCls}>Giờ</label><input type="time" className={inputCls} value={time} onChange={e => setTime(e.target.value)} /></div>
        </div>
        <button className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Lưu khoản chi</button>
      </form>
    </Sheet>
  );
}

/* ---------- Form Hạn mức ---------- */
function LimitForm({ month, current, onSave, onClose }) {
  const [amount, setAmount] = useState(current ? String(current) : '');
  const [err, setErr] = useState('');
  const submit = e => {
    e.preventDefault();
    const n = Number(amount);
    if (!n || n <= 0) return setErr('Hạn mức phải lớn hơn 0');
    onSave(month, n); onClose();
  };
  return (
    <Sheet title={`Hạn mức tháng ${month.slice(5)}/${month.slice(0,4)}`} onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <input inputMode="numeric" autoFocus value={fmtDigits(amount)} onChange={e => setAmount(onlyDigits(e.target.value))}
          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xl font-black text-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        <p className="text-xs text-slate-500">Hạn mức này áp dụng cho tháng đã chọn và các tháng sau cho tới khi bạn đổi lại.</p>
        <button className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Áp dụng</button>
      </form>
    </Sheet>
  );
}

/* ---------- Form Nhắc nhở ---------- */
function ReminderForm({ onSave, onClose }) {
  const [f, setF] = useState({ title: '', note: '', type: 'once', date: todayStr(), dayOfMonth: 1, time: '' });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const submit = e => {
    e.preventDefault();
    if (!f.title.trim()) return setErr('Nhập tiêu đề nhắc nhở');
    if (!f.time) return setErr('Chọn giờ reo chuông');
    if (f.type === 'once' && !f.date) return setErr('Chọn ngày nhắc');
    onSave({
      id: uid(), title: f.title.trim(), note: f.note.trim(), type: f.type, time: f.time,
      date: f.type === 'once' ? f.date : null,
      dayOfMonth: f.type === 'monthly' ? Number(f.dayOfMonth) : null,
      enabled: true, fired: false, lastFired: null, createdAt: new Date().toISOString(),
    });
    onClose();
  };
  return (
    <Sheet title="Thêm nhắc nhở" onClose={onClose}>
      <ErrorBox msg={err} />
      <form onSubmit={submit} className="space-y-3">
        <div><label className={labelCls}>Tiêu đề *</label>
          <input className={inputCls} autoFocus maxLength={150} value={f.title} onChange={e => set('title', e.target.value)} /></div>
        <div><label className={labelCls}>Ghi chú</label>
          <input className={inputCls} maxLength={300} value={f.note} onChange={e => set('note', e.target.value)} /></div>
        <div className="grid grid-cols-3 gap-2">
          {[['once','📅 Một lần'],['daily','🔁 Hàng ngày'],['monthly','📆 Hàng tháng']].map(([v, l]) => (
            <button type="button" key={v} onClick={() => set('type', v)} className={`py-2 text-xs font-bold rounded-xl border ${f.type === v ? 'bg-amber-50 border-amber-400 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>{l}</button>
          ))}
        </div>
        {f.type === 'once' && <div><label className={labelCls}>Ngày</label><input type="date" className={inputCls} value={f.date} onChange={e => set('date', e.target.value)} /></div>}
        {f.type === 'monthly' && <div><label className={labelCls}>Ngày trong tháng</label>
          <select className={inputCls} value={f.dayOfMonth} onChange={e => set('dayOfMonth', e.target.value)}>
            {Array.from({ length: 31 }, (_, i) => i + 1).map(d => <option key={d} value={d}>Ngày {d}</option>)}
          </select></div>}
        <div><label className={labelCls}>Giờ reo chuông</label>
          <input type="time" className={inputCls} value={f.time} onChange={e => set('time', e.target.value)} /></div>
        <p className="text-xs text-slate-500">Lưu ý: nhắc nhở chỉ reo khi trang đang mở trên máy. Nếu đóng trình duyệt hoặc khóa điện thoại lâu, sẽ không reo.</p>
        <button className="w-full py-2.5 rounded-xl bg-amber-500 text-white font-bold">Lưu nhắc nhở</button>
      </form>
    </Sheet>
  );
}

/* ---------- Các màn hình ---------- */
function TasksView({ tasks, date, setDate, onAdd, onToggle, onDelete }) {
  const list = tasks.filter(t => t.date === date);
  const done = list.filter(t => t.status === 'done');
  const todo = list.filter(t => t.status !== 'done');
  const pct = list.length ? Math.round(done.length / list.length * 100) : 0;
  const toggle = t => {
    if (t.status === 'done') return onToggle(t.id, { status: 'todo', actualMinutes: null });
    const v = window.prompt('Việc này thực tế mất bao nhiêu phút? (để trống nếu không cần)', t.estimatedMinutes || '');
    if (v === null) return;
    const mins = v.trim() === '' ? null : Math.max(0, Number(v) || 0);
    onToggle(t.id, { status: 'done', actualMinutes: mins });
  };
  return (
    <div className="p-4 space-y-4 pb-24">
      <div className="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-2">
        <span className="text-xs font-bold text-slate-600">Ngày:</span>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-2 py-1" />
        {date !== todayStr() && <button onClick={() => setDate(todayStr())} className="ml-auto text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">Hôm nay</button>}
      </div>
      <div className="bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-3xl p-5 text-white">
        <div className="text-xs uppercase tracking-wider text-indigo-200">Tiến độ {fmtDate(date)}</div>
        <div className="text-2xl font-bold mt-1">{done.length} / {list.length} việc xong</div>
        <div className="w-full bg-white/20 h-2 rounded-full mt-3"><div className="bg-emerald-400 h-full rounded-full" style={{ width: `${pct}%` }} /></div>
      </div>
      <div>
        <h3 className="text-sm font-bold text-slate-700 mb-2">Chưa làm ({todo.length})</h3>
        {todo.length === 0 ? <div className="bg-white rounded-2xl p-5 text-center text-sm text-slate-500">Không còn việc tồn đọng</div> :
          <div className="space-y-2">{todo.map(t => (
            <div key={t.id} className="bg-white rounded-2xl p-3 shadow-sm flex gap-3 items-start">
              <button onClick={() => toggle(t)} className="text-xl text-slate-300 hover:text-indigo-600">○</button>
              <div className="flex-1 min-w-0">
                <div className="flex justify-between gap-2"><span className="font-bold text-sm truncate">{t.title}</span>
                  {t.priority === 'high' && <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">Ưu tiên cao</span>}</div>
                {t.description && <p className="text-xs text-slate-500 mt-0.5">{t.description}</p>}
                <div className="text-[11px] text-slate-500 mt-1 flex gap-3">
                  {(t.startTime || t.endTime) && <span>🕒 {t.startTime}{t.endTime ? ` - ${t.endTime}` : ''}</span>}
                  {t.estimatedMinutes && <span>Dự kiến {t.estimatedMinutes} phút</span>}
                </div>
              </div>
              <button onClick={() => window.confirm(`Xóa công việc "${t.title}"?`) && onDelete(t.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
            </div>))}</div>}
      </div>
      {done.length > 0 && <div>
        <h3 className="text-sm font-bold text-emerald-700 mb-2">Đã hoàn thành ({done.length})</h3>
        <div className="space-y-2">{done.map(t => (
          <div key={t.id} className="bg-emerald-50/60 rounded-2xl p-3 flex items-center gap-3">
            <button onClick={() => toggle(t)} className="text-emerald-600 text-lg">✓</button>
            <span className="flex-1 text-sm line-through text-slate-500 truncate">{t.title}</span>
            <span className="text-[11px] text-emerald-700">{t.actualMinutes != null ? `${t.actualMinutes} phút` : 'chưa ghi phút'}</span>
            <button onClick={() => window.confirm(`Xóa công việc "${t.title}"?`) && onDelete(t.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
          </div>))}</div>
      </div>}
      <button onClick={onAdd} className="fixed bottom-20 right-5 w-14 h-14 rounded-full bg-indigo-600 text-white text-3xl shadow-lg">+</button>
    </div>
  );
}

function ExpensesView({ expenses, limits, month, setMonth, onAdd, onDelete, onSetLimit }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const list = expenses.filter(e => e.date.startsWith(month));
  const total = list.reduce((s, e) => s + e.amount, 0);
  const limit = limitFor(limits, month);
  const left = limit - total;
  const over = limit > 0 && total > limit;
  const pct = limit > 0 ? Math.min(Math.round(total / limit * 100), 100) : 0;
  const shown = list.filter(e => (cat === 'all' || e.category === cat) &&
    (!q.trim() || e.note.toLowerCase().includes(q.toLowerCase().trim()) || CATS[e.category]?.label.toLowerCase().includes(q.toLowerCase().trim())))
    .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  return (
    <div className="p-4 space-y-4 pb-24">
      <div className="bg-white rounded-2xl p-3 shadow-sm flex items-center justify-between">
        <input type="month" value={month} onChange={e => e.target.value && setMonth(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-2 py-1" />
        {month !== monthStr() && <button onClick={() => setMonth(monthStr())} className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full">Tháng này</button>}
      </div>
      <div className="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-3xl p-5 text-white">
        <div className="flex justify-between items-center">
          <span className="text-xs uppercase tracking-wider text-emerald-100">Đã chi tháng {month.slice(5)}</span>
          <button onClick={() => onSetLimit(month)} className="text-[11px] font-semibold bg-white/20 px-2.5 py-1 rounded-full">Hạn mức</button>
        </div>
        <div className="text-3xl font-extrabold mt-1">{fmtVND(total)}</div>
        {limit > 0 ? <>
          <div className="w-full bg-black/20 h-2.5 rounded-full mt-4 overflow-hidden"><div className={`h-full rounded-full ${over ? 'bg-rose-400' : 'bg-white'}`} style={{ width: `${pct}%` }} /></div>
          <div className="flex justify-between text-xs mt-2 text-emerald-100"><span>Hạn mức {fmtVND(limit)}</span><span>{over ? `Vượt ${fmtVND(-left)}` : `Còn ${fmtVND(left)}`}</span></div>
        </> : <p className="text-xs text-emerald-100 mt-3">Chưa đặt hạn mức cho tháng này.</p>}
      </div>
      {over && <div className="bg-rose-50 border border-rose-200 rounded-2xl p-3 text-xs font-semibold text-rose-700">⚠️ Bạn đã chi vượt hạn mức tháng này!</div>}
      <div className="flex gap-2">
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Tìm theo ghi chú..." className={inputCls} />
      </div>
      <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
        {[['all','Tất cả'], ...Object.entries(CATS).map(([k, c]) => [k, c.icon + ' ' + c.label])].map(([k, l]) => (
          <button key={k} onClick={() => setCat(k)} className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap border ${cat === k ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-200'}`}>{l}</button>
        ))}
      </div>
      <div className="flex justify-between text-xs text-slate-500"><span>{shown.length} khoản</span><span>Tổng: {fmtVND(shown.reduce((s, e) => s + e.amount, 0))}</span></div>
      {shown.length === 0 ? <div className="bg-white rounded-2xl p-5 text-center text-sm text-slate-500">Chưa có khoản chi nào</div> :
        <div className="space-y-2">{shown.map(e => {
          const c = CATS[e.category] || CATS.other;
          return (<div key={e.id} className="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-3">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${c.cls}`}>{c.icon}</div>
            <div className="flex-1 min-w-0">
              <div className="flex justify-between"><span className="text-xs font-bold">{c.label}</span><span className="text-sm font-bold text-rose-600">-{fmtVND(e.amount)}</span></div>
              <p className="text-xs text-slate-600 truncate">{e.note}</p>
              <div className="flex justify-between text-[11px] text-slate-400 mt-1"><span>{fmtDate(e.date)} • {e.time}</span>
                <button onClick={() => window.confirm('Xóa khoản chi này?') && onDelete(e.id)} className="hover:text-rose-600">🗑</button></div>
            </div></div>);
        })}</div>}
      <button onClick={onAdd} className="fixed bottom-20 right-5 w-14 h-14 rounded-full bg-emerald-600 text-white text-3xl shadow-lg">+</button>
    </div>
  );
}

function RemindersView({ reminders, onToggle, onDelete, onAdd, onTest }) {
  const active = reminders.filter(r => r.enabled).length;
  const typeLabel = r => r.type === 'daily' ? 'Hàng ngày' : r.type === 'monthly' ? `Ngày ${r.dayOfMonth} hàng tháng` : `Ngày ${fmtDate(r.date)}`;
  return (
    <div className="p-4 space-y-4 pb-24">
      <div className="bg-gradient-to-r from-amber-500 to-orange-500 rounded-3xl p-4 text-white flex justify-between items-center">
        <div><div className="font-bold">Nhắc nhở & báo giờ</div><div className="text-xs text-amber-100">{active} lịch đang bật</div></div>
        <button onClick={onTest} className="bg-white/25 text-xs font-bold px-3 py-1.5 rounded-full">🔔 Thử chuông</button>
      </div>
      {reminders.length === 0 ? <div className="bg-white rounded-2xl p-5 text-center text-sm text-slate-500">Chưa có lịch nhắc nhở</div> :
        <div className="space-y-2">{reminders.map(r => (
          <div key={r.id} className={`bg-white rounded-2xl p-3 shadow-sm flex items-center gap-3 ${r.enabled ? '' : 'opacity-60'}`}>
            <div className="flex-1 min-w-0">
              <div className="font-bold text-sm truncate">{r.title}</div>
              {r.note && <p className="text-xs text-slate-500 truncate">{r.note}</p>}
              <div className="text-xs mt-1 flex gap-2"><span className="font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-lg">{r.time}</span><span className="text-slate-500">{typeLabel(r)}</span></div>
              {r.type === 'once' && r.fired && <div className="text-[11px] text-emerald-700 mt-1">✓ Đã nhắc</div>}
            </div>
            <button onClick={() => onToggle(r.id)} className={`w-11 h-6 rounded-full relative ${r.enabled ? 'bg-amber-500' : 'bg-slate-200'}`}>
              <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${r.enabled ? 'left-5' : 'left-0.5'}`} /></button>
            <button onClick={() => window.confirm(`Xóa nhắc nhở "${r.title}"?`) && onDelete(r.id)} className="text-slate-300 hover:text-rose-600">🗑</button>
          </div>))}</div>}
      <button onClick={onAdd} className="fixed bottom-20 right-5 w-14 h-14 rounded-full bg-amber-500 text-white text-3xl shadow-lg">+</button>
    </div>
  );
}

function ReportView({ tasks, expenses, limits, month, setMonth, onImport, data }) {
  const mTasks = tasks.filter(t => t.date.startsWith(month));
  const done = mTasks.filter(t => t.status === 'done');
  const withMins = done.filter(t => t.actualMinutes != null || t.estimatedMinutes != null);
  const totalMins = withMins.reduce((s, t) => s + (t.actualMinutes ?? t.estimatedMinutes), 0);
  const noMins = done.length - withMins.length;
  const mExp = expenses.filter(e => e.date.startsWith(month));
  const total = mExp.reduce((s, e) => s + e.amount, 0);
  const limit = limitFor(limits, month);
  const byCat = Object.entries(mExp.reduce((acc, e) => { acc[e.category] = (acc[e.category] || 0) + e.amount; return acc; }, {}))
    .sort((a, b) => b[1] - a[1]);
  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `sao-luu-${todayStr()}.json`; a.click();
  };
  const importData = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (window.confirm('Nhập file sẽ THAY THẾ toàn bộ dữ liệu hiện có. Tiếp tục?')) onImport(obj);
      } catch { alert('File không hợp lệ'); }
    };
    reader.readAsText(file); e.target.value = '';
  };
  return (
    <div className="p-4 space-y-4 pb-24">
      <div className="bg-white rounded-2xl p-3 shadow-sm flex items-center justify-between">
        <input type="month" value={month} onChange={e => e.target.value && setMonth(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-2 py-1" />
      </div>
      <div className="bg-white rounded-3xl p-5 shadow-sm space-y-3">
        <h3 className="font-bold">Công việc</h3>
        <div className="grid grid-cols-3 gap-2 text-center">
          <div className="bg-slate-50 p-2 rounded-xl"><div className="text-[10px] text-slate-400 font-bold">TỔNG</div><div className="font-black">{mTasks.length}</div></div>
          <div className="bg-emerald-50 p-2 rounded-xl"><div className="text-[10px] text-emerald-600 font-bold">XONG</div><div className="font-black text-emerald-700">{done.length}</div></div>
          <div className="bg-amber-50 p-2 rounded-xl"><div className="text-[10px] text-amber-600 font-bold">CHƯA</div><div className="font-black text-amber-700">{mTasks.length - done.length}</div></div>
        </div>
        <p className="text-sm">Tổng thời gian đã làm: <b>{Math.floor(totalMins / 60)} giờ {totalMins % 60} phút</b></p>
        {noMins > 0 && <p className="text-xs text-amber-700">{noMins} việc đã xong nhưng chưa có số phút, không được tính vào tổng.</p>}
      </div>
      <div className="bg-white rounded-3xl p-5 shadow-sm space-y-3">
        <h3 className="font-bold">Chi tiêu</h3>
        <div className="flex justify-between text-sm"><span>Tổng đã chi</span><b className="text-rose-600">{fmtVND(total)}</b></div>
        <div className="flex justify-between text-sm"><span>Hạn mức</span><b>{limit ? fmtVND(limit) : 'Chưa đặt'}</b></div>
        {limit > 0 && <div className={`text-sm font-bold ${total > limit ? 'text-rose-600' : 'text-emerald-600'}`}>{total > limit ? `Vượt ${fmtVND(total - limit)}` : `Còn ${fmtVND(limit - total)}`}</div>}
        {byCat.length === 0 ? <p className="text-xs text-slate-400">Chưa có chi tiêu tháng này</p> : byCat.map(([k, v]) => {
          const c = CATS[k] || CATS.other; const p = total ? Math.round(v / total * 100) : 0;
          return <div key={k}><div className="flex justify-between text-xs"><span>{c.icon} {c.label}</span><span className="font-bold">{fmtVND(v)} ({p}%)</span></div>
            <div className="w-full bg-slate-100 h-2 rounded-full mt-1"><div className={`${c.bar} h-full rounded-full`} style={{ width: `${p}%` }} /></div></div>;
        })}
      </div>
      <div className="bg-white rounded-3xl p-5 shadow-sm space-y-2">
        <h3 className="font-bold">Sao lưu dữ liệu</h3>
        <p className="text-xs text-slate-500">Dữ liệu chỉ nằm trong trình duyệt này. Nên xuất file sao lưu định kỳ.</p>
        <div className="flex gap-2">
          <button onClick={exportData} className="flex-1 py-2 rounded-xl bg-slate-800 text-white text-sm font-bold">Xuất file</button>
          <label className="flex-1 py-2 rounded-xl bg-slate-200 text-center text-sm font-bold cursor-pointer">Nhập file<input type="file" accept="application/json" className="hidden" onChange={importData} /></label>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState('tasks');
  const [tasks, setTasks] = useState(() => load(KEYS.tasks, []));
  const [expenses, setExpenses] = useState(() => load(KEYS.expenses, []));
  const [limits, setLimits] = useState(() => load(KEYS.limits, {}));
  const [reminders, setReminders] = useState(() => load(KEYS.reminders, []));
  const [pinHash, setPinHash] = useState(() => load(KEYS.pin, null));
  const [locked, setLocked] = useState(() => !!load(KEYS.pin, null));
  const [date, setDate] = useState(todayStr());
  const [month, setMonth] = useState(monthStr());
  const [modal, setModal] = useState(null);
  const [alarm, setAlarm] = useState(null);

  useEffect(() => save(KEYS.tasks, tasks), [tasks]);
  useEffect(() => save(KEYS.expenses, expenses), [expenses]);
  useEffect(() => save(KEYS.limits, limits), [limits]);
  useEffect(() => save(KEYS.reminders, reminders), [reminders]);
  useEffect(() => { if (pinHash) save(KEYS.pin, pinHash); else { try { localStorage.removeItem(KEYS.pin); } catch {} } }, [pinHash]);

  // Kiểm tra nhắc nhở: mỗi 5 giây và khi quay lại tab
  const remRef = useRef(reminders);
  remRef.current = reminders;
  useEffect(() => {
    const fire = r => {
      setAlarm(r);
      playChime(2);
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification('⏰ ' + r.title, { body: r.note || `Giờ hẹn: ${r.time}` }); } catch {}
      }
    };
    const check = () => {
      const now = new Date(), today = todayStr(), hm = nowHM();
      let changed = false;
      const next = remRef.current.map(r => {
        if (!r.enabled || !r.time || r.time > hm) return r;
        let due = false;
        if (r.type === 'once') due = r.date === today && !r.fired;
        if (r.type === 'daily') due = r.lastFired !== today;
        if (r.type === 'monthly') due = Number(r.dayOfMonth) === now.getDate() && r.lastFired !== today;
        if (!due) return r;
        changed = true;
        fire(r);
        return r.type === 'once' ? { ...r, fired: true, enabled: false } : { ...r, lastFired: today };
      });
      if (changed) setReminders(next);
    };
    check();
    const id = setInterval(check, 5000);
    document.addEventListener('visibilitychange', check);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', check); };
  }, []);

  const requestNotif = () => {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  };

  const toggleTask = (id, patch) => setTasks(p => p.map(t => t.id === id ? { ...t, ...patch, completedAt: patch.status === 'done' ? new Date().toISOString() : null } : t));
  const deleteTask = id => setTasks(p => p.filter(t => t.id !== id));
  const addExpense = e => setExpenses(p => [e, ...p]);
  const deleteExpense = id => setExpenses(p => p.filter(e => e.id !== id));
  const setLimit = (m, amount) => setLimits(p => ({ ...p, [m]: amount }));
  const toggleReminder = id => setReminders(p => p.map(r => r.id === id ? { ...r, enabled: !r.enabled, fired: false } : r));
  const deleteReminder = id => setReminders(p => p.filter(r => r.id !== id));
  const addReminder = r => { requestNotif(); setReminders(p => [r, ...p]); };

  const savePin = (hash, done) => { setPinHash(hash); if (!hash) setLocked(false); done(); };

  const importAll = obj => {
    if (Array.isArray(obj.tasks)) setTasks(obj.tasks);
    if (Array.isArray(obj.expenses)) setExpenses(obj.expenses);
    if (obj.limits && typeof obj.limits === 'object') setLimits(obj.limits);
    if (Array.isArray(obj.reminders)) setReminders(obj.reminders);
  };

  const tabs = [
    ['tasks', 'Việc làm', '✅'], ['expenses', 'Chi tiêu', '💰'], ['reminders', 'Nhắc nhở', '🔔'], ['report', 'Tổng kết', '📊'],
  ];
  const pendingTasks = tasks.filter(t => t.status !== 'done').length;
  const activeRem = reminders.filter(r => r.enabled).length;

  if (locked && pinHash) return <PinLock pinHash={pinHash} onUnlock={() => setLocked(false)} />;

  const headerRight = (<>
    {pinHash && <button className={iconBtn} title="Khóa ngay" onClick={() => setLocked(true)}>🔒</button>}
    <button className={iconBtn} title="Cài đặt PIN" onClick={() => setModal('pin')}>⚙️</button>
  </>);
  const titles = { tasks: ['Công việc', fmtDate(date)], expenses: ['Chi tiêu', `Tháng ${month.slice(5)}/${month.slice(0,4)}`], reminders: ['Nhắc nhở', `${activeRem} lịch đang bật`], report: ['Tổng kết', `Tháng ${month.slice(5)}/${month.slice(0,4)}`] };

  return (
    <div className="min-h-screen max-w-md mx-auto bg-slate-50 flex flex-col relative">
      {alarm && (
        <div className="fixed top-3 inset-x-3 z-50 bg-gradient-to-r from-rose-600 to-amber-600 text-white rounded-2xl p-3.5 shadow-2xl flex items-center justify-between">
          <div className="min-w-0"><div className="text-[10px] uppercase text-amber-200 font-bold">Đến giờ hẹn</div><div className="text-sm font-extrabold truncate">{alarm.title}</div></div>
          <button onClick={() => setAlarm(null)} className="bg-white text-rose-700 font-bold px-3 py-1.5 rounded-xl text-xs shrink-0">Tắt chuông</button>
        </div>
      )}
      <Header title={titles[tab][0]} subtitle={titles[tab][1]} right={headerRight} />
      <main className="flex-1 overflow-y-auto">
        {tab === 'tasks' && <TasksView tasks={tasks} date={date} setDate={setDate} onAdd={() => setModal('task')} onToggle={toggleTask} onDelete={deleteTask} />}
        {tab === 'expenses' && <ExpensesView expenses={expenses} limits={limits} month={month} setMonth={setMonth} onAdd={() => setModal('expense')} onDelete={deleteExpense} onSetLimit={() => setModal('limit')} />}
        {tab === 'reminders' && <RemindersView reminders={reminders} onToggle={toggleReminder} onDelete={deleteReminder} onAdd={() => setModal('reminder')} onTest={() => { playChime(1); requestNotif(); }} />}
        {tab === 'report' && <ReportView tasks={tasks} expenses={expenses} limits={limits} month={month} setMonth={setMonth} onImport={importAll}
          data={{ tasks, expenses, limits, reminders }} />}
      </main>
      <nav className="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-30">
        {tabs.map(([id, label, icon]) => {
          const badge = id === 'tasks' ? pendingTasks : id === 'reminders' ? activeRem : 0;
          return (
            <button key={id} onClick={() => setTab(id)} className={`relative flex flex-col items-center px-3 text-xs ${tab === id ? 'text-indigo-600 font-bold' : 'text-slate-400'}`}>
              <span className="text-lg">{icon}</span>{label}
              {badge > 0 && <span className="absolute -top-1 right-0 bg-rose-500 text-white text-[10px] rounded-full px-1.5">{badge}</span>}
            </button>);
        })}
      </nav>

      {modal === 'task' && <TaskForm date={date} onSave={addTask => setTasks(p => [{ ...addTask }, ...p])} onClose={() => setModal(null)} />}
      {modal === 'expense' && <ExpenseForm onSave={addExpense} onClose={() => setModal(null)} />}
      {modal === 'reminder' && <ReminderForm onSave={addReminder} onClose={() => setModal(null)} />}
      {modal === 'limit' && <LimitForm month={month} current={limitFor(limits, month)} onSave={setLimit} onClose={() => setModal(null)} />}
      {modal === 'pin' && <PinSettings pinHash={pinHash} onSave={savePin} onClose={() => setModal(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
