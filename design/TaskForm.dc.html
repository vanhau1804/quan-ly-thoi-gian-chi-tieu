<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm việc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
label{display:block}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:rgba(14,17,22,.45);position:relative;overflow:hidden">
  <div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:20px 20px 28px;background:#FFFFFF;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px">
    <div style="width:40px;height:4px;border-radius:2px;background:#E3DFD6;align-self:center"></div>
    <h2 style="margin:0;font-size:20px;font-weight:700;color:#1B1F24">Thêm việc</h2>
    <label style="font-size:13px;font-weight:600;color:#1B1F24">Tên việc
      <input type="text" placeholder="Ví dụ: Tập gym" style="margin-top:6px;width:100%;box-sizing:border-box;height:52px;padding:0 14px;border-radius:12px;border:1px solid #5B6470;font-size:16px;font-family:inherit;color:#1B1F24">
    </label>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <label style="font-size:13px;font-weight:600;color:#1B1F24">Giờ
        <input type="time" value="18:00" style="margin-top:6px;width:100%;box-sizing:border-box;height:52px;padding:0 14px;border-radius:12px;border:1px solid #5B6470;font-size:16px;font-family:inherit;color:#1B1F24">
      </label>
      <label style="font-size:13px;font-weight:600;color:#1B1F24">Nhóm
        <select style="margin-top:6px;width:100%;box-sizing:border-box;height:52px;padding:0 14px;border-radius:12px;border:1px solid #5B6470;font-size:16px;font-family:inherit;color:#1B1F24;background:#FFFFFF">
          <option>Công việc</option>
          <option>Sức khỏe</option>
          <option>Gia đình</option>
          <option>Cá nhân</option>
        </select>
      </label>
    </div>
    <label style="font-size:13px;font-weight:600;color:#1B1F24">Nhắc trước (không bắt buộc)
      <select style="margin-top:6px;width:100%;box-sizing:border-box;height:52px;padding:0 14px;border-radius:12px;border:1px solid #5B6470;font-size:16px;font-family:inherit;color:#1B1F24;background:#FFFFFF">
        <option>Không nhắc</option>
        <option>5 phút</option>
        <option>15 phút</option>
        <option>1 giờ</option>
      </select>
    </label>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px">
      <a href="Main.dc.html" style="height:52px;border-radius:26px;border:1px solid #5B6470;background:#FFFFFF;color:#1B1F24;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">Hủy</a>
      <a href="Main.dc.html" style="height:52px;border-radius:26px;background:#B45309;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Lưu việc</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
