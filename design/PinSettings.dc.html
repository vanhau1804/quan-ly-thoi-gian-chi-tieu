<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F4EF;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <div style="padding:56px 20px 8px;display:flex;align-items:center;gap:12px">
    <a href="Report.dc.html" aria-label="Quay lại báo cáo" style="font-size:24px;color:#0F766E">‹</a>
    <h1 style="margin:0;font-size:24px;font-weight:700;color:#1B1F24">Khóa PIN</h1>
  </div>
  <div style="margin:12px 20px 0;padding:16px;background:#FFFFFF;border:1px solid #E3DFD6;border-radius:16px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:16px;font-weight:600;color:#1B1F24">Bật khóa PIN</div><div style="font-size:13px;color:#5B6470">PIN 4 số</div></div>
    <button onClick="{{toggleOn}}" aria-label="{{onAria}}" aria-pressed="{{onPressed}}" style="all:unset;cursor:pointer;width:48px;height:28px;border-radius:14px;box-sizing:border-box;position:relative;{{switchBg}}"><span style="position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;{{knob}}"></span></button>
  </div>
  <div style="margin:12px 20px 0;display:flex;flex-direction:column;gap:10px">
    <a href="Pin.dc.html" style="height:56px;padding:0 16px;box-sizing:border-box;border-radius:14px;border:1px solid #E3DFD6;background:#FFFFFF;color:#1B1F24;font-size:15px;font-weight:600;display:flex;align-items:center">Đổi PIN</a>
    <div style="padding:16px;background:#FFFFFF;border:1px solid #E3DFD6;border-radius:14px">
      <div style="font-size:15px;font-weight:600;color:#1B1F24">Tự khóa khi chạy nền</div>
      <div style="margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
        <sc-for list="{{lockOpts}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="all:unset;cursor:pointer;box-sizing:border-box;padding:8px 0;border-radius:10px;text-align:center;font-size:13px;{{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <a href="Pin.dc.html" style="height:56px;padding:0 16px;box-sizing:border-box;border-radius:14px;border:1px solid #BE123C;background:#FFFFFF;color:#BE123C;font-size:15px;font-weight:600;display:flex;align-items:center">Xóa PIN (cần nhập PIN hiện tại)</a>
  </div>
  <div style="margin:16px 20px 0;padding:12px 14px;border-radius:12px;background:#EDEAE2;font-size:13px;line-height:1.5;color:#1B1F24">Sai 5 lần liên tiếp sẽ khóa tạm 30 giây, lần sau tăng gấp đôi, tối đa 15 phút.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = this.state.on ?? true;
const lock = this.state.lock ?? '1';
const lockOpts = [['0', 'Ngay'], ['1', '1 phút'], ['5', '5 phút']].map(([v, l]) => {
const picked = lock === v;
return {
label: l,
pressed: picked ? 'true' : 'false',
style: picked ? 'background:#0F766E;color:#FFFFFF;font-weight:600' : 'background:#EDEAE2;color:#1B1F24',
pick: () => this.setState({ lock: v })
};
});
return {
lockOpts,
onPressed: on ? 'true' : 'false',
onAria: on ? 'Tắt khóa PIN' : 'Bật khóa PIN',
switchBg: on ? 'background:#0F766E' : 'background:#B8B2A6',
knob: on ? 'right:3px' : 'left:3px',
toggleOn: () => this.setState({ on: !on })
};
}
}
</script>
</body>
</html>
